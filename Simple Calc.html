<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Finance Calculator</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .calculator-card {
            max-width: 700px;
            margin: 50px auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
        }

        .result-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card calculator-card">
        <div class="card-header bg-primary text-white text-center py-3">
            <h3 class="mb-0">Property Finance Calculator</h3>
        </div>

        <div class="card-body p-4">

            <div class="mb-3">
                <label class="form-label">Market Value (£)</label>
                <input type="number" id="marketValue" class="form-control" placeholder="Enter Market Value">
            </div>

            <div class="mb-3">
                <label class="form-label">Purchase Price (£)</label>
                <input type="number" id="purchasePrice" class="form-control" placeholder="Enter Purchase Price">
            </div>

            <div class="mb-3">
                <label class="form-label">Property Type</label>
                <select id="propertyType" class="form-select">
                    <option value="resi">Residential</option>
                    <option value="commercial">Commercial</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Credit Profile</label>
                <select id="creditType" class="form-select">
                    <option value="good">Good Credit</option>
                    <option value="bad">Bad Credit</option>
                </select>
            </div>

            <button class="btn btn-primary w-100" onclick="calculateFinance()">
                Calculate
            </button>

            <div id="results" class="result-box mt-4 d-none">
    <div class="row text-center">

        <div class="col-md-4">
            <h5>LTV Calculation</h5>
            <div class="result-value" id="ltvAmount">£0</div>
            <small id="ltvPercent">75% LTV</small>
        </div>

        <div class="col-md-4">
            <h5>LTC Calculation</h5>
            <div class="result-value" id="ltcAmount">£0</div>
            <small id="ltcPercent">85% LTC</small>
        </div>

        <div class="col-md-4">
            <h5>Maximum Loan</h5>
            <div class="result-value" id="maximumLoan">£0</div>
            <small id="limitingFactor">Limited by LTV</small>
        </div>

    </div>
</div>

        </div>
    </div>
</div>

<script>
function calculateFinance() {

    const mv = parseFloat(document.getElementById('marketValue').value) || 0;
    const pp = parseFloat(document.getElementById('purchasePrice').value) || 0;

    const propertyType = document.getElementById('propertyType').value;
    const creditType = document.getElementById('creditType').value;

    let ltvRate = 0.75;
    let ltcRate = 0.85;

    // Commercial deduction
    if (propertyType === 'commercial') {
        ltvRate -= 0.05;
        ltcRate -= 0.05;
    }

    // Bad credit deduction
    if (creditType === 'bad') {
        ltvRate -= 0.05;
        ltcRate -= 0.05;
    }

    const ltvAmount = mv * ltvRate;
    const ltcAmount = pp * ltcRate;

    const maximumLoan = Math.min(ltvAmount, ltcAmount);

    const limitingFactor =
        ltvAmount <= ltcAmount
            ? `${(ltvRate * 100).toFixed(0)}% LTV`
            : `${(ltcRate * 100).toFixed(0)}% LTC`;

    document.getElementById('ltvAmount').innerText =
        '£' + ltvAmount.toLocaleString('en-GB');

    document.getElementById('ltcAmount').innerText =
        '£' + ltcAmount.toLocaleString('en-GB');

    document.getElementById('maximumLoan').innerText =
        '£' + maximumLoan.toLocaleString('en-GB');

    document.getElementById('ltvPercent').innerText =
        `${(ltvRate * 100).toFixed(0)}% LTV`;

    document.getElementById('ltcPercent').innerText =
        `${(ltcRate * 100).toFixed(0)}% LTC`;

    document.getElementById('limitingFactor').innerText =
        `Limited by ${limitingFactor}`;

    document.getElementById('results').classList.remove('d-none');
}
</script>

</body>
</html>
